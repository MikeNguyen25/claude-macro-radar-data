name: sol-daily

# Pulls daily Solana metrics (DefiLlama, Farside) into data/sol_daily.json every 3 hours.
# The macro-radar-claude app copies this file into its database at the nightly review (23:30 Vietnam time)
# and whenever Claude is asked to update the app.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: sol-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch daily data
        run: python3 scripts/fetch_sol_daily.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: Solana daily $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
